[project]
name = "openacl"
version = "0.0.1"
description = "Smartphone-video gait analysis for ACL reconstruction rehab: kinematics, norm bands, symmetry, trends, explained findings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Anton Salcher" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "pyarrow>=17",
]

[project.optional-dependencies]
sports2d = ["sports2d>=0.8"]
norm = ["ezc3d>=1.5", "requests>=2.32", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
openacl = "openacl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openacl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
